# Configuração de ferramentas do repositório (os pacotes ficam em core/, backend/ e desktop/).

[tool.pytest.ini_options]
pythonpath = ["core", "desktop", "backend"]
testpaths = ["core/tests", "desktop/tests", "backend"]
# backend: pytest-django (DJANGO_SETTINGS_MODULE=config.settings.dev)

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

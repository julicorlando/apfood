name: CI

on:
  push:
    branches: ["**"]

permissions:
  contents: write  # para commitar migrations geradas em branches de trabalho

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: apfood
          POSTGRES_PASSWORD: apfood
          POSTGRES_DB: apfood
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U apfood" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-nao-e-segredo
      DATABASE_URL: postgres://apfood:apfood@localhost:5432/apfood
      APFOOD_CHANNELS_MEMORIA: "1"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Instalar dependências
        working-directory: backend
        run: pip install -r requirements/dev.txt

      - name: Testes do core e do PDV (sem Django)
        run: pytest core/tests desktop/tests -q

      - name: Testes do carrinho do cardápio (JavaScript)
        run: node --test backend/apps/vitrine/tests/carrinho.test.js

      - name: Django check
        working-directory: backend
        run: python manage.py check

      - name: Gerar migrations faltantes (branches que não são main)
        if: github.event_name == 'push' && github.ref_name != 'main'
        working-directory: backend
        run: |
          python manage.py makemigrations
          if [ -n "$(git status --porcelain -- apps)" ]; then
            git config user.name "apfood-ci"
            git config user.email "ci@apfood.invalid"
            git add apps/*/migrations
            git commit -m "chore: migrations geradas pela CI"
            git push
            echo "::notice::Migrations geradas e commitadas — a próxima execução valida."
          fi

      - name: Migrations em dia
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Migrate + seed demo
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo

      - name: Testes do backend
        working-directory: backend
        run: pytest -q

  pdv:
    name: PDV desktop (interface)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop/pyproject.toml
      - name: Bibliotecas do Qt
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 > /dev/null
      - name: Instalar
        run: pip install -e core -e desktop pytest
      - name: Testes do PDV
        env:
          APFOOD_SEM_SOM: "1"
        run: pytest desktop/tests -q -p no:faulthandler

  pdv-windows:
    name: Instalador Windows (ApFoodPDV.exe)
    runs-on: windows-latest
    needs: pdv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        # SEM -e: o PyInstaller não enxerga pacotes instalados em modo editável
        # (foi o que deixou o apfood_core de fora do exe na 0.2.0)
        run: pip install ./core ./desktop pyinstaller
      - name: Gerar executável
        run: >
          pyinstaller --noconfirm --onefile --windowed --name ApFoodPDV
          --paths core --paths desktop --icon desktop/apfood_pdv/recursos/apfood.ico
          --add-data "desktop/apfood_pdv/recursos;apfood_pdv/recursos"
          --collect-submodules apfood_pdv --collect-submodules apfood_core
          --hidden-import PySide6.QtMultimedia --hidden-import PySide6.QtWebSockets
          desktop/pdv.py
      - name: Teste do executável (importa todos os módulos e sai)
        shell: pwsh
        run: |
          if (!(Test-Path dist/ApFoodPDV.exe)) { throw "exe não gerado" }
          "{0:N1} MB" -f ((Get-Item dist/ApFoodPDV.exe).Length / 1MB)
          $p = Start-Process dist/ApFoodPDV.exe -ArgumentList "--autoteste" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "autoteste do exe falhou (código $($p.ExitCode))" }
          "autoteste ok"
      - uses: actions/upload-artifact@v4
        with:
          name: ApFoodPDV-windows
          path: dist/ApFoodPDV.exe
          retention-days: 30
      - name: Publicar release (main) — base da atualização automática
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $versao = (Select-String -Path desktop/apfood_pdv/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          $tag = "pdv-v$versao"
          $sha = (Get-FileHash dist/ApFoodPDV.exe -Algorithm SHA256).Hash.ToLower()
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { "Release $tag já existe — suba __version__ para publicar outra"; exit 0 }
          $notas = "PDV $versao`n`nSHA-256: $sha`n`nNo servidor:`nAPFOOD_PDV_VERSAO=$versao`nAPFOOD_PDV_URL=https://github.com/${{ github.repository }}/releases/download/$tag/ApFoodPDV.exe`nAPFOOD_PDV_SHA256=$sha"
          gh release create $tag dist/ApFoodPDV.exe --title "ApFood PDV $versao" --notes $notas

  producao:
    name: Imagem de produção (Docker / Coolify)
    runs-on: ubuntu-latest
    needs: testes
    env:
      SERVICE_BASE64_64_DJANGO: ci-segredo-nao-usar-em-producao-0123456789abcdef
      SERVICE_PASSWORD_POSTGRES: ci-senha
      SERVICE_PASSWORD_MASTER: ci-master
      APFOOD_DOMINIO: apfood.exemplo.com.br
    steps:
      - uses: actions/checkout@v4
      - name: Subir web + postgres + redis
        run: docker compose -f docker-compose.prod.yml up -d --build --wait --wait-timeout 180 web
      - name: Conferir HTTP (health, admin, cardápio, API, WebSocket ASGI)
        run: |
          set -e
          ex() { docker compose -f docker-compose.prod.yml exec -T web "$@"; }
          H='-H Host:apfood.exemplo.com.br -H X-Forwarded-Proto:https'
          ex curl -fsS http://127.0.0.1:8000/health/
          ex sh -c "curl -fsS $H -o /dev/null -w 'admin %{http_code}\n' http://127.0.0.1:8000/admin/login/"
          ex python manage.py seed_demo
          ex sh -c "curl -fsS $H http://127.0.0.1:8000/burger-demo/ | grep -q 'dados-cardapio'"
          ex sh -c "curl -fsS $H http://127.0.0.1:8000/static/vitrine/cardapio.js -o /dev/null"
          ex sh -c "curl -fsS $H http://127.0.0.1:8000/api/publico/lojas/burger-demo/ | grep -q X-Burger"
          ex sh -c "curl -fsS $H -X POST -H 'Content-Type: application/json' -d '{\"username\":\"master\",\"password\":\"ci-master\"}' http://127.0.0.1:8000/api/auth/token/ | grep -q access"
          ex sh -c "curl -fsS $H http://127.0.0.1:8000/painel/entrar/ | grep -q 'marca/logo'"
          ex sh -c "curl -fsS $H http://127.0.0.1:8000/planos/ | grep -q 'Teste'"
          docker compose -f docker-compose.prod.yml ps
      - name: Backup automático gera o arquivo e ele restaura
        run: |
          set -e
          dc() { docker compose -f docker-compose.prod.yml "$@"; }
          dc up -d backup
          for i in $(seq 1 30); do dc logs backup | grep -q "backup ok" && break; sleep 2; done
          dc logs backup
          dc logs backup | grep -q "backup ok"
          arq=$(dc exec -T backup sh -c 'ls -1 /backups/apfood-*.dump | tail -1')
          dc exec -T backup sh -c "createdb restaurado && pg_restore -d restaurado --no-owner $arq && psql -d restaurado -tAc 'select count(*) from lojas'"
      - name: Logs em caso de falha
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --tail 200

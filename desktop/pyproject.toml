[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "apfood-pdv"
version = "0.1.0"
description = "ApFood PDV — app desktop de frente de caixa"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.7",                               # interface, som, WebSocket
  "pywin32>=306; sys_platform == 'win32'",      # impressora instalada no Windows (spooler RAW)
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10"]

[project.scripts]
apfood-pdv = "apfood_pdv.__main__:main"

[tool.setuptools.packages.find]
include = ["apfood_pdv*"]

[tool.setuptools.package-data]
apfood_pdv = ["recursos/*"]

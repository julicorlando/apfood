services:
  postgres:
    image: postgres:17-alpine
    container_name: apfood-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: apfood
      POSTGRES_PASSWORD: apfood
      POSTGRES_DB: apfood
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apfood"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

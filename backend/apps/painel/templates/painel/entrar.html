{% load static %}<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e4572e">
  <title>Entrar — ApFood</title>
  <link rel="stylesheet" href="{% static 'painel/painel.css' %}">
</head>
<body class="tela-entrar">
  <main class="entrar">
    <form method="post" class="entrar-cartao" novalidate>
      {% csrf_token %}
      <a href="/" class="marca marca-grande">Ap<span>Food</span></a>
      <p class="entrar-sub">Entre para gerenciar sua loja</p>
      {% if form.non_field_errors %}
        <div class="alerta alerta-erro" role="alert">
          {% for e in form.non_field_errors %}{% if "bloqueado" in e %}{{ e }}{% else %}Usuário ou senha incorretos.{% endif %}{% endfor %}
        </div>
      {% endif %}
      <label class="campo">
        <span>Usuário</span>
        <input type="text" name="username" autocomplete="username" autocapitalize="none" autofocus required
               value="{{ form.username.value|default:'' }}">
      </label>
      <label class="campo">
        <span>Senha</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <input type="hidden" name="next" value="{{ next|default:'/painel/' }}">
      <button type="submit" class="botao botao-primario botao-bloco">Entrar</button>
    </form>
  </main>
</body>
</html>

{% load static %}<!doctype html>
<html lang="pt-br">

  <meta name="theme-color" content="#f26a0f">
  <title>{% block titulo %}ApFood{% endblock %} — ApFood</title>
  {% include "marca/cabeca.html" %}
  <link rel="stylesheet" href="{% static 'painel/painel.css' %}">
</head>
<body class="tela-entrar">

    <div class="entrar-cartao">
      <a href="/" class="marca marca-grande"><img src="{% static 'marca/logo.png' %}" srcset="{% static 'marca/logo@2x.png' %} 2x" alt="ApFood"></a>
      {% block conteudo %}{% endblock %}
    </div>
  </main>

</html>

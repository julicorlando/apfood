# Produção (Coolify → "Docker Compose", arquivo: docker-compose.prod.yml).
# Domínio: no Coolify, em "web", informe https://apfood.axionwebdigital.com.br:8000
# Variáveis SERVICE_* são geradas pelo próprio Coolify na primeira implantação.
services:
  web:
    build: .
    command: ["web"]
    restart: unless-stopped
    environment: &ambiente
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${SERVICE_BASE64_64_DJANGO}
      DJANGO_ALLOWED_HOSTS: ${APFOOD_DOMINIO:-apfood.axionwebdigital.com.br},localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: https://${APFOOD_DOMINIO:-apfood.axionwebdigital.com.br}
      CORS_ALLOWED_ORIGINS: https://${APFOOD_DOMINIO:-apfood.axionwebdigital.com.br}
      APFOOD_URL_PUBLICA: https://${APFOOD_DOMINIO:-apfood.axionwebdigital.com.br}
      DATABASE_URL: postgres://apfood:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/apfood
      REDIS_URL: redis://redis:6379/0
      APFOOD_SERVIR_MEDIA: "1"
      APFOOD_CHAVE_CRIPTO: ${APFOOD_CHAVE_CRIPTO:-}
      APFOOD_MP_TOKEN_PLATAFORMA: ${APFOOD_MP_TOKEN_PLATAFORMA:-}
      APFOOD_IFOOD_CLIENT_ID: ${APFOOD_IFOOD_CLIENT_ID:-}
      APFOOD_IFOOD_CLIENT_SECRET: ${APFOOD_IFOOD_CLIENT_SECRET:-}
      APFOOD_DIAS_TOLERANCIA: ${APFOOD_DIAS_TOLERANCIA:-10}
      APFOOD_PDV_VERSAO: ${APFOOD_PDV_VERSAO:-}
      APFOOD_PDV_URL: ${APFOOD_PDV_URL:-}
      APFOOD_PDV_SHA256: ${APFOOD_PDV_SHA256:-}
      APFOOD_PDV_OBRIGATORIA_ATE: ${APFOOD_PDV_OBRIGATORIA_ATE:-}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-master}
      DJANGO_SUPERUSER_PASSWORD: ${SERVICE_PASSWORD_MASTER}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    volumes:
      - media:/app/backend/media
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  tarefas:
    build: .
    command: ["tarefas"]
    restart: unless-stopped
    environment: *ambiente
    volumes:
      - media:/app/backend/media
    depends_on: [web]
    healthcheck:
      disable: true

  ifood:
    build: .
    command: ["ifood"]
    restart: unless-stopped
    environment: *ambiente
    depends_on: [web]
    healthcheck:
      disable: true

  cobranca:
    build: .
    command: ["cobranca"]
    restart: unless-stopped
    environment: *ambiente
    depends_on: [web]
    healthcheck:
      disable: true

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: apfood
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: apfood
      TZ: America/Sao_Paulo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apfood -d apfood"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Cópia diária do banco e das fotos (volume "backups"). Guarda BACKUP_DIAS dias.
  # Restaurar: ver docs/DEPLOY.md, seção Backup.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: apfood
      PGDATABASE: apfood
      PGPASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      TZ: America/Sao_Paulo
      BACKUP_DIAS: ${BACKUP_DIAS:-14}
      BACKUP_HORA: ${BACKUP_HORA:-04}
    volumes:
      - backups:/backups
      - media:/media
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u
        copiar() {
          d=$$(date +%Y%m%d-%H%M)
          if pg_dump -Fc -f /backups/apfood-$$d.dump.tmp; then
            mv /backups/apfood-$$d.dump.tmp /backups/apfood-$$d.dump
            tar -czf /backups/media-$$d.tar.gz -C /media . 2>/dev/null || true
            find /backups -name 'apfood-*.dump' -mtime +$$BACKUP_DIAS -delete
            find /backups -name 'media-*.tar.gz' -mtime +$$BACKUP_DIAS -delete
            echo "backup ok: apfood-$$d.dump ($$(du -h /backups/apfood-$$d.dump | cut -f1))"
          else
            rm -f /backups/apfood-$$d.dump.tmp
            echo "BACKUP FALHOU em $$d" >&2
          fi
        }
        copiar  # uma cópia ao subir (deploy)
        while true; do
          agora=$$(date +%H%M); alvo=$${BACKUP_HORA}00
          [ "$$agora" = "$$alvo" ] && copiar && sleep 61
          sleep 30
        done
    healthcheck:
      disable: true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

volumes:
  media:
  pgdata:
  redisdata:
  backups:
